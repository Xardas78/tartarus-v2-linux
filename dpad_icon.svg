<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Style-Definitionen für Farben und Typografie -->
  <style>
    .bg { fill: #111111; }
    .label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-size: 26px; fill: #888888; text-anchor: middle; font-weight: 500; }
    .dot { fill: #444444; }
    .dpad-base { fill: #1a1a1a; stroke: #333333; stroke-width: 3; }
    .dpad-center { fill: #111111; stroke: #2a2a2a; stroke-width: 2; }
    .arrow-key { fill: #262626; stroke: #3a3a3a; stroke-width: 2; }
    .arrow-icon { fill: #666666; }
  </style>

  <!-- Neutraler dunkler Hintergrund (wird im Canvas angezeigt, ist aber flexibel) -->
  <rect width="600" height="600" class="bg" rx="15" />

  <!-- Beschriftungen (Labels) -->
  <text x="300" y="70" class="label">Up</text>
  <text x="300" y="555" class="label">Down</text>
  <text x="90" y="309" class="label" style="text-anchor: start;">Left</text>
  <text x="510" y="309" class="label" style="text-anchor: end;">Right</text>

  <!-- Indikator-Punkte (Dots) zwischen Text und Steuerkreuz -->
  <circle cx="300" cy="190" r="5" class="dot" />
  <circle cx="300" cy="410" r="5" class="dot" />
  <circle cx="190" cy="300" r="5" class="dot" />
  <circle cx="410" cy="300" r="5" class="dot" />

  <!-- Das Steuerkreuz (D-Pad) Gruppen-Zentrierung -->
  <g transform="translate(300, 300)">
    <!-- Äußerer Kreis als Basis -->
    <circle cx="0" cy="0" r="85" class="dpad-base" />

    <!-- OBERE Taste (Up) -->
    <path d="M -22,-75 L 22,-75 C 26,-75 28,-72 26,-65 L 18,-35 C 17,-30 13,-25 5,-25 L -5,-25 C -13,-25 -17,-30 -18,-35 L -26,-65 C -28,-72 -26,-75 -22,-75 Z" class="arrow-key" />
    <!-- Pfeil-Icon Oben -->
    <path d="M 0,-62 L -8,-52 L -3,-52 L -3,-42 L 3,-42 L 3,-52 L 8,-52 Z" class="arrow-icon" />

    <!-- UNTERE Taste (Down) -->
    <path d="M -22,75 L 22,75 C 26,75 28,72 26,65 L 18,35 C 17,30 13,25 5,25 L -5,25 C -13,25 -17,30 -18,35 L -26,65 C -28,72 -26,75 -22,75 Z" class="arrow-key" />
    <!-- Pfeil-Icon Unten -->
    <path d="M 0,62 L -8,52 L -3,52 L -3,42 L 3,42 L 3,52 L 8,52 Z" class="arrow-icon" />

    <!-- LINKE Taste (Left) -->
    <path d="M -75,-22 L -75,22 C -75,26 -72,28 -65,26 L -35,18 C -30,17 -25,13 -25,5 L -25,-5 C -25,-13 -30,-17 -35,-18 L -65,-26 C -72,-28 -75,-26 -75,-22 Z" class="arrow-key" />
    <!-- Pfeil-Icon Links -->
    <path d="M -62,0 L -52,-8 L -52,-3 L -42,-3 L -42,3 L -52,3 L -52,8 Z" class="arrow-icon" />

    <!-- RECHTE Taste (Right) -->
    <path d="M 75,-22 L 75,22 C 75,26 72,28 65,26 L 35,18 C 30,17 25,13 25,5 L 25,-5 C 25,-13 30,-17 35,-18 L 65,-26 C 72,-28 75,-26 75,-22 Z" class="arrow-key" />
    <!-- Pfeil-Icon Rechts -->
    <path d="M 62,0 L 52,-8 L 52,-3 L 42,-3 L 42,3 L 52,3 L 52,8 Z" class="arrow-icon" />

    <!-- Zentraler innerer Kreis des Steuerkreuzes -->
    <circle cx="0" cy="0" r="32" class="dpad-center" />
  </g>
</svg>
